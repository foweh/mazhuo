<!doctype html><html lang="en"><head><meta charset="UTF-8"><link rel="icon" type="image/svg+xml" href="./favicon.svg"><meta name="viewport" content="width=device-width,initial-scale=1"><title>应用标题</title><link href="https://lf3-static.bytednsdoc.com/obj/eden-cn/ylcylz_fsph_ryhs/ljhwZthlaukjlkulzlp/feisuda/feisuda.svg" rel="shortcut icon"><style>
#sec-titles{position:fixed;inset:0;z-index:2147483646}
#sec-titles .st{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(1200px 600px at 50% -10%,#1e4bd8 0%,#0f2f6e 55%,#081b3f 100%);color:#fff;text-align:center;padding:40px 24px;opacity:0;visibility:hidden;transition:opacity .45s ease;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
#sec-titles .st.on{opacity:1;visibility:visible}
#sec-titles .badge{font-size:14px;letter-spacing:4px;padding:7px 18px;border:1px solid rgba(255,255,255,.5);border-radius:999px;opacity:.9}
#sec-titles .st h1{font-size:clamp(34px,7.5vw,60px);font-weight:700;margin:0;letter-spacing:3px;line-height:1.25;text-shadow:0 4px 24px rgba(0,0,0,.35)}
#sec-titles .st .sub{font-size:clamp(15px,3.2vw,20px);opacity:.85;max-width:640px;line-height:1.6}
#sec-titles .hint{position:absolute;bottom:34px;left:0;right:0;font-size:13px;opacity:.7;animation:st-fade 1.2s ease .5s both}
@keyframes st-fade{to{opacity:0}}
</style>
<script>
(function(){
  var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
  /* ===== 四个板块片头（标题文字发我后替换） ===== */
  var SECTIONS=[
    {t:'情景一',s:'副标题待定 · 发我真实标题后替换'},
    {t:'情景二',s:'副标题待定 · 发我真实标题后替换'},
    {t:'情景三',s:'副标题待定 · 发我真实标题后替换'},
    {t:'情景四',s:'副标题待定 · 发我真实标题后替换'}
  ];
  /* 音频解锁（手机自动播放限制） */
  var ctxs=[],AC=window.AudioContext||window.webkitAudioContext;
  if(AC){var Orig=AC,Patched=function(){var a=[].slice.call(arguments),C=Orig.bind.apply(Orig,[null].concat(a)),c=new C();ctxs.push(c);return c;};Patched.prototype=Orig.prototype;window.AudioContext=Patched;if(window.webkitAudioContext)window.webkitAudioContext=Patched;}
  function unlock(){
    ctxs.forEach(function(c){if(c&&c.state==='suspended'){try{c.resume();}catch(e){}}});
    document.querySelectorAll('audio,video').forEach(function(m){
      m.muted=false;
      if(m.paused&&m.currentTime===0){var p=m.play();if(p&&p.catch)p.catch(function(){});}
    });
  }
  /* 模拟按下空格键：手机没有键盘，触摸屏幕 = 按空格 */
  function pressSpace(){
    var opts={bubbles:true,cancelable:true,composed:true,code:'Space',key:' ',keyCode:32,which:32,charCode:32};
    var t=document.body||document;
    try{t.dispatchEvent(new KeyboardEvent('keydown',opts));}catch(e){}
    try{t.dispatchEvent(new KeyboardEvent('keyup',opts));}catch(e){}
  }
  /* 构建四个片头页 */
  var root=document.createElement('div');
  root.id='sec-titles';
  SECTIONS.forEach(function(sec,i){
    var d=document.createElement('div');
    d.className='st';
    d.innerHTML='<span class="badge">反诈情景互动 · 第'+(i+1)+'部分</span><h1>'+sec.t+'</h1><div class="sub">'+sec.s+'</div><div class="hint">'+(isTouch?'单击 进入内容 · 双击 下一片头':'空格 进入内容 · T键 下一片头')+'</div>';
    root.appendChild(d);
  });
  var cur=-1; /* -1 = 片头隐藏，显示应用内容 */
  function showTitle(i){
    var cards=root.querySelectorAll('.st');
    for(var k=0;k<cards.length;k++)cards[k].classList.remove('on');
    if(i>=0)cards[i].classList.add('on');
    cur=i;
  }
  function nextTitle(){ showTitle(cur<3?cur+1:-1); }
  function mount(){ if(!root.parentNode)document.body.appendChild(root); }
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',function(){mount();showTitle(0);});
  }else{mount();showTitle(0);}
  /* 桌面键盘 */
  document.addEventListener('keydown',function(e){
    unlock();
    if(e.code==='Space'){
      if(cur>=0){e.preventDefault();e.stopImmediatePropagation();showTitle(-1);}
      return;
    }
    if(e.code==='Tab'||e.key==='t'||e.key==='T'){e.preventDefault();e.stopImmediatePropagation();nextTitle();}
  });
  /* 单击=隐藏片头/空格推进，双击=下一片头（点击事件，手机桌面通用） */
  var lastTap=0,tapTimer=null;
  function onTap(x,y){
    if(cur>=0){showTitle(-1);return;}
    var el=document.elementFromPoint(x,y);
    var interactive=el&&el.closest&&el.closest('button,a,input,select,textarea,[role="button"],[contenteditable="true"]');
    if(!interactive)pressSpace();
  }
  document.addEventListener('click',function(ev){
    unlock();
    var now=Date.now();
    if(now-lastTap<320){ if(tapTimer){clearTimeout(tapTimer);tapTimer=null;} lastTap=0; nextTitle(); return; }
    lastTap=now;
    if(tapTimer)clearTimeout(tapTimer);
    var x=ev.clientX,y=ev.clientY;
    tapTimer=setTimeout(function(){tapTimer=null;onTap(x,y);},320);
  });
  document.addEventListener('touchstart',function(){unlock();},{passive:true});
})();
</script>
