<script>
(function(){
  var isTouch=('ontouchstart' in window)||(navigator.maxTouchPoints>0)||(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches);
  if(!isTouch)return;
  var ctxs=[],AC=window.AudioContext||window.webkitAudioContext;
  if(AC){var Orig=AC,Patched=function(){var a=[].slice.call(arguments),C=Orig.bind.apply(Orig,[null].concat(a)),c=new C();ctxs.push(c);return c;};Patched.prototype=Orig.prototype;window.AudioContext=Patched;if(window.webkitAudioContext)window.webkitAudioContext=Patched;}
  function unlock(){
    ctxs.forEach(function(c){if(c&&c.state==='suspended'){try{c.resume();}catch(e){}}});
    document.querySelectorAll('audio,video').forEach(function(m){
      m.muted=false;
      if(m.paused&&m.currentTime===0){var p=m.play();if(p&&p.catch)p.catch(function(){});}
    });
  }
  function tapStartControl(){
    var els=document.querySelectorAll('button,[role="button"],.ant-btn');
    for(var i=0;i<els.length;i++){
      var t=(els[i].textContent||'').trim();
      if(t&&/^(开始|播放|进入|启动|继续)/.test(t)){try{els[i].click();}catch(e){}break;}
    }
  }
  function dismissOverlay(){
    var o=document.getElementById('tap-start');
    if(o&&o.parentNode)o.parentNode.removeChild(o);
    unlock();
  }
  var overlay=document.createElement('div');
  overlay.id='tap-start';
  overlay.innerHTML='<div class="icon">👆</div><div class="text">轻触屏幕开始</div><div class="hint">点击屏幕任意位置开始播放</div>';
  function mount(){if(!document.getElementById('tap-start'))document.body.appendChild(overlay);}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();

  document.addEventListener('touchstart',function(ev){

      if(!isStart)tapStartControl();
    },0);
  },{once:true,passive:true});
  document.addEventListener('click',function(){dismissOverlay();},{once:true});
  document.addEventListener('touchstart',function(){unlock();},{passive:true});
})();
</script>
