<script>

    });

  /* 模拟按下空格键：手机没有键盘，触摸屏幕 = 按空格 */
  function pressSpace(){

    var t=document.body||document;
    try{t.dispatchEvent(new KeyboardEvent('keydown',opts));}catch(e){}

  }
  function dismissOverlay(){
    var o=document.getElementById('tap-start');
    if(o&&o.parentNode)o.parentNode.removeChild(o);
  }
  var overlay=document.createElement('div');
  overlay.id='tap-start';
  overlay.innerHTML='<div class="icon">👆</div><div class="text">轻触屏幕开始</div><div class="hint">相当于键盘上的空格键，继续播放请再点屏幕</div>';

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();

    if(firstGesture)return;
    handleGesture(ev.clientX,ev.clientY);
  },{once:true});
})();
</script>
